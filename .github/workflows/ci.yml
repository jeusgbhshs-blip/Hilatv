name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        run: python -m pip install -e ".[dev]"

      - name: Install ffmpeg and tesseract
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -q

      - name: Accept T03
        run: make accept-t03

      - name: Accept T05
        run: make accept-t05

      - name: Accept T06
        run: make accept-t06

      - name: Accept T07
        run: make accept-t07

      - name: Accept T08
        run: make accept-t08

      - name: Accept T09
        run: make accept-t09

      - name: Accept T10
        run: make accept-t10

      - name: Accept T12
        run: make accept-t12

      - name: Accept T15
        run: make accept-t15

      - name: Accept T13
        run: make accept-t13

      - name: Accept T14
        run: make accept-t14

      - name: Accept T16
        run: make accept-t16

      - name: Accept T18
        run: make accept-t18

      - name: Accept T20
        run: make accept-t20

      - name: Accept T21
        run: make accept-t21

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Web lint and build
        working-directory: apps/web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run build

      - name: Accept T11
        run: make accept-t11

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        run: python -m pip install -e ".[dev]"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Compose health and smoke tests
        run: make up && make accept-t01

      - name: Accept T03 against Postgres and Redis
        run: make accept-t03
        env:
          ACCEPT_T03_REQUIRE_POSTGRES: "1"
          ACCEPT_T03_REQUIRE_REDIS: "1"

      - name: Accept T04 media samples from MinIO
        run: make accept-t04
        env:
          ACCEPT_T04_REQUIRE_MINIO: "1"

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: hilatv
          POSTGRES_PASSWORD: hilatv_dev
          POSTGRES_DB: hilatv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hilatv -d hilatv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://hilatv:hilatv_dev@localhost:5432/hilatv
      HILATV_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        run: python -m pip install -e ".[dev]"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: T02 schema and migration acceptance
        run: make accept-t02

      - name: T03 gateway acceptance on migrated Postgres
        run: make accept-t03
        env:
          ACCEPT_T03_REQUIRE_POSTGRES: "1"
