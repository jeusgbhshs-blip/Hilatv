[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hilatv"
version = "0.1.0"
description = "HiLatv — one sentence in, a publishable commercial short video out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "jinja2>=3.1.4",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.3",
  "httpx>=0.28.0",
  "pyyaml>=6.0.2",
  "redis>=5.2.0",
  "jsonschema>=4.23.0",
  "pypdf>=5.1",
  "pillow>=10.4.0",
  "temporalio>=1.9,<2",
  "python-multipart>=0.0.18",
]

[project.scripts]
hilatv = "workers.workflow.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "httpx>=0.28.0",
  "ruff>=0.8.4",
  "fakeredis>=2.26.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*", "workers*", "eval*"]

[tool.setuptools.package-data]
"workers.brand_kit" = ["prompts/*.j2"]
"workers.nodes.n03_concept" = ["prompts/*.j2"]
"workers.nodes.n01_brief" = ["prompts/*.j2"]
"workers.nodes.n04_script" = ["prompts/*.j2"]
"workers.nodes.n05_storyboard" = ["prompts/*.j2"]
"workers.nodes.n06_voiceover" = ["lexicon.yaml"]
"workers.nodes.n08_keyframe" = ["prompts/*.j2"]
"workers.nodes.n10_video" = ["prompts/*.j2"]
"workers.nodes.n09_keyframe_qa" = ["prompts/*.j2"]
"workers.nodes.n11_video_qa" = ["prompts/*.j2"]
"workers.nodes.n17_deliver" = ["prompts/*.j2"]
"workers.schemas" = ["json_schema/*.json"]
gateway = ["routes.yaml", "pricing.yaml"]
eval = ["prompts/*.j2", "briefs/*.yaml"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "apps/api/tests",
  "gateway/tests",
  "workers/brand_kit/tests",
  "workers/nodes/n01_brief/tests",
  "workers/nodes/n03_concept/tests",
  "workers/nodes/n04_script/tests",
  "workers/nodes/n05_storyboard/tests",
  "workers/nodes/n06_voiceover/tests",
  "workers/nodes/n08_keyframe/tests",
  "workers/nodes/n10_video/tests",
  "workers/nodes/n09_keyframe_qa/tests",
  "workers/nodes/n11_video_qa/tests",
  "workers/qa/tests",
  "workers/nodes/n13_subtitle/tests",
  "workers/nodes/n14_packaging/tests",
  "workers/nodes/n15_compose/tests",
  "workers/nodes/n17_deliver/tests",
  "workers/schemas/tests",
  "workers/workflow/tests",
  "eval/tests",
]
pythonpath = [".", "apps/api"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "workers", "gateway", "eval", "tests", "migrations"]
extend-exclude = [".venv", "apps/web", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "gateway", "workers", "eval"]

[tool.coverage.run]
source = ["workers/schemas"]
omit = ["workers/schemas/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
