# Assumed public list prices in CNY per 1,000,000 tokens.
# These are configuration, not a contract. Edit this file to match the invoice.
# Unknown models use `default` so a new live route still has a non-zero estimate.

default_output_tokens: 512

default:
  input_per_million: "2"
  output_per_million: "8"

# Used when the route model is not listed below (for example an endpoint id override).
# These are configuration, not an invoice. Edit them with the vendor price sheet.
task_defaults:
  image:
    unit: image
    per_image: "0.20"
  video:
    unit: second
    per_second: "0.50"
    default_seconds: 5
  tts:
    unit: char
    per_thousand_chars: "2.00"
  asr:
    unit: second
    per_second: "0.004"
    default_seconds: 5

