# Model routes. Re-read on every call when the file contents change (hot reload).
# shot_type / language "*" is the wildcard. A more specific row wins.

version: 1
defaults:
  timeout_s: 60

routes:
  - id: llm-close-up-en
    task: llm
    shot_type: close_up
    language: en
    timeout_s: 45
    primary: {provider: deepseek, model: deepseek-chat}
    fallbacks:
      - {provider: dashscope, model: qwen-plus}

  - id: llm-default
    task: llm
    shot_type: "*"
    language: "*"
    timeout_s: 60
    primary: {provider: deepseek, model: deepseek-chat}
    fallbacks:
      - {provider: dashscope, model: qwen-plus}
      - {provider: ark, model: doubao-pro-32k}

  # N8 still has one live image adapter. Person shots name a different model so the
  # prompt template can follow the route. Missing providers fall through to mock.
  - id: image-person
    task: image
    shot_type: person
    language: "*"
    timeout_s: 120
    primary: {provider: kling, model: kling-image-v1}
    fallbacks:
      - {provider: seedream, model: doubao-seedream-4-0-250828}
      - {provider: mock, model: mock-image}

  - id: image-default
    task: image
    shot_type: "*"
    language: "*"
    timeout_s: 120
    primary: {provider: seedream, model: doubao-seedream-4-0-250828}
    fallbacks:
      - {provider: mock, model: mock-image}

  # N10 routes by shot family. Only Seedance is implemented; the other names are
  # the route table's preferred models and are skipped until an adapter exists.
  - id: video-product
    task: video
    shot_type: product
    language: "*"
    timeout_s: 300
    primary: {provider: seedance, model: doubao-seedance-1-0-pro-250528}
    fallbacks:
      - {provider: mock, model: mock-video}

  - id: video-person
    task: video
    shot_type: person
    language: "*"
    timeout_s: 300
    primary: {provider: kling, model: kling-o3}
    fallbacks:
      - {provider: seedance, model: doubao-seedance-1-0-pro-250528}
      - {provider: mock, model: mock-video}

  - id: video-multi-ref
    task: video
    shot_type: multi_ref
    language: "*"
    timeout_s: 300
    primary: {provider: seedance, model: doubao-seedance-1-0-pro-250528}
    fallbacks:
      - {provider: kling, model: kling-o3}
      - {provider: mock, model: mock-video}

  - id: video-atmosphere
    task: video
    shot_type: atmosphere
    language: "*"
    timeout_s: 300
    primary: {provider: dashscope, model: wanx-v1}
    fallbacks:
      - {provider: seedance, model: doubao-seedance-1-0-pro-250528}
      - {provider: mock, model: mock-video}

  - id: video-default
    task: video
    shot_type: "*"
    language: "*"
    timeout_s: 300
    primary: {provider: seedance, model: doubao-seedance-1-0-pro-250528}
    fallbacks:
      - {provider: mock, model: mock-video}

  - id: tts-default
    task: tts
    shot_type: "*"
    language: "*"
    timeout_s: 60
    primary: {provider: volc_tts, model: seed-tts-1.0}
    fallbacks:
      - {provider: mock, model: mock-tts}

  - id: asr-default
    task: asr
    shot_type: "*"
    language: "*"
    timeout_s: 60
    primary: {provider: volc_asr, model: volc-asr-1.0}
    fallbacks:
      - {provider: mock, model: mock-asr}

  - id: music-default
    task: music
    shot_type: "*"
    language: "*"
    timeout_s: 120
    primary: {provider: mock, model: mock-music}
    fallbacks: []

  # Local stand-ins for BiRefNet / RMBG-2.0 and IC-Light. No weights are downloaded.
  # A missing local adapter falls through to the mock, which calls the same code.
  - id: matte-default
    task: matte
    shot_type: "*"
    language: "*"
    timeout_s: 60
    primary: {provider: local_matting, model: birefnet-rmbg-2.0-local}
    fallbacks:
      - {provider: mock, model: mock-matte}

  - id: relight-default
    task: relight
    shot_type: "*"
    language: "*"
    timeout_s: 60
    primary: {provider: local_relight, model: ic-light-local}
    fallbacks:
      - {provider: mock, model: mock-relight}

  # Two vision judges. Without a key, or with HILATV_LIVE left off, both fall through to mock.
  - id: judge-cross
    task: judge
    shot_type: cross_review
    language: "*"
    timeout_s: 90
    primary: {provider: gemini, model: gemini-2.0-flash}
    fallbacks:
      - {provider: mock, model: mock-judge-cross}

  - id: judge-default
    task: judge
    shot_type: "*"
    language: "*"
    timeout_s: 90
    primary: {provider: qwen_vl, model: qwen-vl-max}
    fallbacks:
      - {provider: mock, model: mock-judge}
